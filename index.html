<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TS Frontend Capstone</title>
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <!-- css -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!--  -->
    <section class="content">
      <header>
        <nav>
          <img
            src="/assets/images/logo_black.svg"
            alt="planet logo"
            class="nav-logo-dark"
          />
          <button class="theme-button">
            <p class="theme-text">DARK</p>
            <img
              src="/assets/icons/ThemeIcon.svg"
              alt="theme icon can be half moon or a sun"
              class="theme-icon"
            />
          </button>
        </nav>

        <div class="search-container">
          <div class="input-box">
            <img
              src="/assets/icons/SearchIcon.svg"
              alt="search icon"
              class="search-icon"
            />
            <input
              type="text"
              class="search-input"
              id="input-search"
              placeholder="Search planet name"
            />
          </div>
          <button class="search-btn">Search</button>
        </div>
      </header>
      <main>
        <img
          src="/assets/images/earth.png"
          alt="plantet image"
          class="planet-img"
        />
        <div class="description">
          <h3 class="planet-name">Earth</h3>
          <p class="planet-type">Terrestial</p>
          <p class="planet-description">
            The only known planet to suppport life, with liquid water on its
            surface.
          </p>
        </div>
      </main>
      <section></section>
      <section></section>
      <footer></footer>

      <!-- js -->

      <script src="js/app.js"></script>
    </section>
  </body>
</html>
